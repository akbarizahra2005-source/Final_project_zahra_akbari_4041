<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleFlow</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #5b6cff;
        --primary-dark: #4f46e5;
        --border: #e5e7eb;
        --bg: #f9fafb;
        --radius: 28px;
        --success: #10b981;
        --error: #ef4444;
        --neutral: #6b7280;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: #eef2ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 1100px;
        max-width: 95%;
        height: 700px;
        background: #fff;
        border-radius: var(--radius);
        display: flex;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
      }

      .left-panel {
        flex: 1;
        background: linear-gradient(135deg, #1e40af, #3b82f6);
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #fff;
      }

      .left-panel h1 {
        font-size: 38px;
        font-weight: 700;
        line-height: 1.2;
      }
      .left-panel p {
        font-size: 18px;
        margin-top: 12px;
        opacity: 0.95;
      }

      .left-panel h2 {
        font-size: 34px;
        font-weight: 700;
      }
      .left-panel .bottom p {
        font-size: 18px;
        margin-top: 12px;
      }

      .right-panel {
        flex: 1.1;
        padding: 50px 60px;
        background: var(--bg);
      }

      .logo {
        display: flex;
        align-items: center;
        font-size: 30px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 20px;
      }

      .logo::before {
        content: "▶";
        margin-right: 12px;
        font-size: 32px;
      }

      .tabs {
        display: flex;
        gap: 20px;
        margin-bottom: 28px;
      }

      .tab {
        padding: 12px 36px;
        border-radius: 24px;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
      }

      .tab.active {
        background: var(--primary);
        color: #fff;
      }
      .tab.inactive {
        background: #e0e7ff;
        color: var(--primary);
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
      }

      input {
        width: 100%;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 15px;
      }

      .input-wrapper {
        position: relative;
      }

      .toggle-password {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        color: var(--primary);
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }

      .password-rules {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .rule {
        font-size: 13px;
        color: var(--neutral);
        display: flex;
        align-items: center;
      }

      .rule::before {
        content: "✓";
        margin-right: 8px;
        font-size: 14px;
      }

      .rule.valid {
        color: var(--success);
      }
      .rule.valid::before {
        color: var(--success);
      }
      .rule.invalid {
        color: var(--error);
      }
      .rule.invalid::before {
        color: var(--error);
      }

      .submit {
        margin-top: 6px;
        width: 100%;
        padding: 18px;
        background: var(--primary);
        border: none;
        border-radius: 32px;
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
      }

      .success {
        margin-top: 14px;
        text-align: center;
        color: var(--success);
        font-weight: 600;
        display: none;
      }

      @media (max-width: 992px) {
        .container {
          flex-direction: column;
          height: auto;
          max-height: 90vh;
        }
        .left-panel {
          padding: 50px 40px;
          justify-content: center;
          text-align: center;
        }
        .left-panel .bottom {
          display: none;
        }
        .right-panel {
          padding: 40px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left-panel">
        <div>
          <h1>Welcome to SimpleFlow</h1>
          <p>Your Gateway to Effortless Management.</p>
        </div>
        <div class="bottom">
          <h2>Seamless Collaboration</h2>
          <p>Effortlessly work together with your team in real-time.</p>
        </div>
      </div>

      <div class="right-panel">
        <div class="logo">SimpleFlow</div>

        <div class="tabs">
          <div class="tab active" id="signup-tab">Sign Up</div>
          <div class="tab inactive" id="signin-tab">Sign In</div>
        </div>

        <form id="form">
          <div id="signup-form">
            <div class="form-group">
              <label>Username</label>
              <input placeholder="Pick a username" />
            </div>
            <div class="form-group">
              <label>Full Name</label>
              <input id="name" placeholder="Enter your name" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input
                id="email"
                type="email"
                placeholder="Enter your email address"
              />
            </div>
            <div class="form-group">
              <label>Password</label>
              <div class="input-wrapper">
                <input
                  id="password"
                  type="password"
                  placeholder="Enter password"
                />
                <button type="button" class="toggle-password">Show</button>
              </div>
              <div class="password-rules">
                <div class="rule" id="len">At least 8 characters</div>
                <div class="rule" id="upper">Contains an uppercase letter</div>
                <div class="rule" id="num">Contains a number</div>
                <div class="rule" id="symbol">Contains a symbol (!@#$%^&*)</div>
              </div>
            </div>
            <button type="submit" class="submit">Create Account</button>
            <div class="success" id="success">
              Account Created Successfully!
            </div>
          </div>

          <div id="signin-form" style="display: none">
            <div class="form-group">
              <label>Username</label>
              <input placeholder="Enter your username" />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" placeholder="Enter your password" />
            </div>
            <button type="submit" class="submit">Login</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const pass = document.getElementById("password");
      const success = document.getElementById("success");

      const rules = {
        len: (v) => v.length >= 8,
        upper: (v) => /[A-Z]/.test(v),
        num: (v) => /[0-9]/.test(v),
        symbol: (v) => /[!@#$%^&*(),.?":{}|<>]/.test(v),
      };

      if (pass) {
        pass.addEventListener("input", () => {
          const v = pass.value;
          Object.keys(rules).forEach((id) => {
            const el = document.getElementById(id);
            if (rules[id](v)) {
              el.classList.add("valid");
              el.classList.remove("invalid");
            } else if (v.length > 0) {
              el.classList.add("invalid");
              el.classList.remove("valid");
            } else {
              el.classList.remove("valid", "invalid");
            }
          });
        });
      }

      document.getElementById("form").onsubmit = (e) => {
        e.preventDefault();
        const ok = pass
          ? Object.values(rules).every((fn) => fn(pass.value))
          : true;
        if (
          document.getElementById("signup-form").style.display !== "none" &&
          ok
        ) {
          success.style.display = "block";
        } else if (
          document.getElementById("signin-form").style.display !== "none"
        ) {
          alert("Logged in!");
        }
      };

      document.querySelectorAll(".toggle-password").forEach((btn) => {
        btn.onclick = (e) => {
          const i = e.target.previousElementSibling;
          i.type = i.type === "password" ? "text" : "password";
          e.target.textContent = i.type === "password" ? "Show" : "Hide";
        };
      });

      const signupTab = document.getElementById("signup-tab");
      const signinTab = document.getElementById("signin-tab");
      const signupForm = document.getElementById("signup-form");
      const signinForm = document.getElementById("signin-form");

      signupTab.onclick = () => {
        signupTab.classList.add("active");
        signupTab.classList.remove("inactive");
        signinTab.classList.add("inactive");
        signinTab.classList.remove("active");
        signupForm.style.display = "block";
        signinForm.style.display = "none";
        success.style.display = "none";
      };

      signinTab.onclick = () => {
        signinTab.classList.add("active");
        signinTab.classList.remove("inactive");
        signupTab.classList.add("inactive");
        signupTab.classList.remove("active");
        signinForm.style.display = "block";
        signupForm.style.display = "none";
        success.style.display = "none";
      };
    </script>
  </body>
</html>
